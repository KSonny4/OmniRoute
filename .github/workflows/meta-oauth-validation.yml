name: Meta OAuth branch validation

on:
  push:
    branches: [feat/meta-muse-oauth]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: meta-oauth-ci-secret-with-sufficient-length
      API_KEY_SECRET: meta-oauth-ci-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/npm-ci-retry

      - name: Apply Meta OAuth integration corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def update(path, transform):
              p = Path(path)
              before = p.read_text()
              after = transform(before)
              if after == before:
                  print(f"unchanged: {path}")
                  return
              p.write_text(after)
              print(f"updated: {path}")

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          def add_to_set_line(text, marker, anchor, item):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"missing set marker: {marker}")
              end = text.find("]);", start)
              if end < 0:
                  raise SystemExit(f"missing set end: {marker}")
              block = text[start:end]
              if f'"{item}"' in block:
                  return text
              old = f'  "{anchor}",\n'
              new = f'  "{anchor}", "{item}",\n'
              if old not in block:
                  raise SystemExit(f"missing set anchor {anchor} in {marker}")
              patched = block.replace(old, new, 1)
              return text[:start] + patched + text[end:]

          update(
              "src/shared/components/OAuthModal.tsx",
              lambda text: add_to_set_line(text, "const DEVICE_CODE_PROVIDERS", "grok-cli", "muse-code"),
          )
          update(
              "src/app/api/oauth/[provider]/[action]/route.ts",
              lambda text: add_to_set_line(
                  text, "const NO_PKCE_DEVICE_CODE_PROVIDERS", "ghe-copilot", "muse-code"
              ),
          )
          update(
              "src/shared/constants/providers.ts",
              lambda text: replace_once(
                  text,
                  'const DUAL_AUTH_PROVIDER_IDS = new Set(["clinepass", "codebuddy-cn", "xai"]);',
                  'const DUAL_AUTH_PROVIDER_IDS = new Set(["clinepass", "codebuddy-cn", "xai", "muse-code"]);',
                  "dual auth providers",
              ),
          )

          def patch_frontier(text):
              text = replace_once(
                  text,
                  '    website: "https://github.com/meta-llama/llama-stack",\n',
                  '    website: "https://github.com/meta-llama/llama-stack", oauthProviderId: "muse-code",\n',
                  "muse oauth provider id",
              )
              return replace_once(
                  text,
                  '      "Use your META_API_KEY env var as a Bearer token. Muse Code CLI uses the OpenAI Responses API wire format (POST /responses).",',
                  '      "Sign in with Meta OAuth or use a direct Muse API key. Muse Code uses the OpenAI Responses API wire format (POST /responses).",',
                  "muse auth hint",
              )
          update("src/shared/constants/providers/apikey/frontier-labs.ts", patch_frontier)

          def patch_catalog(text):
              text = replace_once(
                  text,
                  '      displayAuthType: group.displayAuthType,',
                  '      displayAuthType: provider.oauthProviderId === provider.id ? "oauth" : group.displayAuthType,',
                  "same-id oauth display auth",
              )
              return replace_once(
                  text,
                  '      toggleAuthType: group.toggleAuthType,',
                  '      toggleAuthType: provider.oauthProviderId === provider.id ? "oauth" : group.toggleAuthType,',
                  "same-id oauth toggle auth",
              )
          update("src/lib/providers/catalog.ts", patch_catalog)

          def patch_oauth_constants(text):
              text = replace_once(
                  text,
                  'import { buildGitLabOAuthEndpoints, GITLAB_DUO_DEFAULT_BASE_URL } from "../gitlab";\n\n/**',
                  'import { buildGitLabOAuthEndpoints, GITLAB_DUO_DEFAULT_BASE_URL } from "../gitlab";\nexport { MUSE_CODE_CONFIG } from "./muse-code";\n/**',
                  "Muse config re-export",
              )
              return replace_once(
                  text,
                  '  CODEBUDDY_CN: "codebuddy-cn",\n',
                  '  CODEBUDDY_CN: "codebuddy-cn", MUSE_CODE: "muse-code",\n',
                  "Muse OAuth provider id",
              )
          update("src/lib/oauth/constants/oauth.ts", patch_oauth_constants)

          def patch_oauth_golden(text):
              text = replace_once(
                  text,
                  '  CODEBUDDY_CN_CONFIG,\n',
                  '  CODEBUDDY_CN_CONFIG, MUSE_CODE_CONFIG,\n',
                  "golden config import",
              )
              text = replace_once(
                  text,
                  '  "codebuddy-cn",\n  "zed",',
                  '  "codebuddy-cn", "muse-code",\n  "zed",',
                  "golden provider list",
              )
              text = replace_once(
                  text,
                  '  "codebuddy-cn": CODEBUDDY_CN_CONFIG,\n',
                  '  "codebuddy-cn": CODEBUDDY_CN_CONFIG, "muse-code": MUSE_CODE_CONFIG,\n',
                  "golden config map",
              )
              return replace_once(
                  text,
                  '  trae: ["apiEndpoint", "chatEndpoint", "webUrl"],\n',
                  '  trae: ["apiEndpoint", "chatEndpoint", "webUrl"], "muse-code": ["clientId", "deviceAuthorizationUrl", "deviceTokenUrl"],\n',
                  "golden required fields",
              )
          update("tests/unit/oauth-providers-config.test.ts", patch_oauth_golden)
          PY

      - name: Lint changed Meta OAuth surface
        run: >-
          npx eslint --suppressions-location config/quality/eslint-suppressions.json
          open-sse/executors/defaultResolver.ts
          open-sse/executors/muse-code.ts
          open-sse/services/museCodeAuth.ts
          open-sse/config/providers/registry/muse-code/index.ts
          src/lib/oauth/constants/muse-code.ts
          src/lib/oauth/constants/oauth.ts
          src/lib/oauth/providers/muse-code.ts
          src/lib/oauth/providers/index.ts
          src/lib/providers/catalog.ts
          src/shared/components/OAuthModal.tsx
          src/shared/constants/providers.ts
          src/shared/constants/providers/apikey/frontier-labs.ts
          'src/app/api/oauth/[provider]/[action]/route.ts'
          'src/app/api/v1/muse-code/models/route.ts'
          tests/unit/muse-code-oauth-provider.test.ts
          tests/unit/muse-code-dual-auth.test.ts
          tests/unit/muse-code-models.test.ts
          tests/unit/muse-code-provider.test.ts
          tests/unit/oauth-providers-config.test.ts

      - name: Focused Meta OAuth tests
        run: >-
          node --import tsx/esm
          --import ./open-sse/utils/setupPolyfill.ts
          --import ./tests/_setup/isolateDataDir.ts
          --test --test-force-exit --test-concurrency=1
          tests/unit/muse-code-oauth-provider.test.ts
          tests/unit/muse-code-dual-auth.test.ts
          tests/unit/muse-code-models.test.ts
          tests/unit/muse-code-provider.test.ts
          tests/unit/oauth-providers-config.test.ts

      - run: npm run check:provider-consistency
      - run: npm run check:known-symbols
      - run: npm run check:public-creds
      - name: Check file size, allowing only the inherited upstream violation
        shell: bash
        run: |
          set +e
          npm run check:file-size 2>&1 | tee /tmp/file-size.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -F '[file-size] 1 violação(ões):' /tmp/file-size.log
          grep -F 'open-sse/utils/stream.ts: 3115 > congelado 3098' /tmp/file-size.log
          if grep -E '^  ✗ ' /tmp/file-size.log | grep -v -F 'open-sse/utils/stream.ts: 3115 > congelado 3098'; then
            echo 'Unexpected file-size violation introduced by this branch.' >&2
            exit 1
          fi
          echo 'Only the inherited upstream stream.ts file-size violation remains.'
      - run: npm run typecheck:core
      - run: npm run check:dashboard-typecheck

      - name: Commit validated integration corrections
        shell: bash
        run: |
          git add \
            src/shared/components/OAuthModal.tsx \
            'src/app/api/oauth/[provider]/[action]/route.ts' \
            src/shared/constants/providers.ts \
            src/shared/constants/providers/apikey/frontier-labs.ts \
            src/lib/providers/catalog.ts \
            src/lib/oauth/constants/oauth.ts \
            tests/unit/oauth-providers-config.test.ts
          if git diff --cached --quiet; then
            echo "No integration corrections to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(meta): complete Muse OAuth integration wiring"
          git push
