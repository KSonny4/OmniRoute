name: Sync generated cli-tunnel skill

on:
  push:
    branches: [feat/meta-muse-oauth]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - name: Generate cli-tunnel skill
        run: node --import tsx/esm scripts/skills/generate-agent-skills.mjs --apply --only=cli-tunnel
      - name: Commit generated skill
        shell: bash
        run: |
          git add skills/cli-tunnel/SKILL.md
          if git diff --cached --quiet; then
            echo "cli-tunnel skill already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(skills): generate cli-tunnel skill"
          git push
