# Fork image build for the Meta/Muse OAuth candidate branch.
# Manual dispatch only: `gh workflow run fork-image.yml --ref <branch> -f tag=<tag>`.
# Builds target runner-web (same as production) and pushes to GHCR under KSonny4.
# Does NOT touch release channels or upstream image names.
name: Fork image (meta-muse-oauth)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 20260915-ba0f882)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push fork web image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          push: true
          tags: ghcr.io/ksonny4/omniroute-meta:${{ inputs.tag }}
