  supportsTokenRefresh,
} from "../../open-sse/services/tokenRefresh.ts";
import { OAUTH_TEST_CONFIG } from "../../src/app/api/providers/[id]/test/oauthTestConfig.ts";

const originalFetch = globalThis.fetch;

test.afterEach(() => {
  globalThis.fetch = originalFetch;
});

test("Meta OAuth requests a device code with the public client id", async () => {
  globalThis.fetch = async (input, init) => {
    assert.equal(String(input), META_MODEL_API_CONFIG.deviceCodeUrl);
    assert.equal(init?.method, "POST");
    const body = init?.body as URLSearchParams;
    assert.equal(body.get("client_id"), META_MODEL_API_CONFIG.clientId);
    return Response.json({
      device_code: "device-123",
      user_code: "ABCD-EFGH",
      verification_uri: "https://auth.meta.com/device",
      expires_in: 600,
      interval: 5,
    });
  };

  const data = await requestDeviceCode("muse-code");
  assert.equal(data.device_code, "device-123");
  assert.equal(data.user_code, "ABCD-EFGH");
});

test("Meta OAuth mints a Model API key after device approval", async () => {
  const calls: string[] = [];
  globalThis.fetch = async (input, init) => {
    const url = String(input);
    calls.push(url);

    if (url === META_MODEL_API_CONFIG.tokenUrl) {
      const body = init?.body as URLSearchParams;
      assert.equal(
        body.get("grant_type"),
        "urn:ietf:params:oauth:grant-type:device_code"
      );
      assert.equal(body.get("device_code"), "device-123");
      assert.equal(body.get("client_id"), META_MODEL_API_CONFIG.clientId);
      return Response.json({ access_token: "meta-identity-token", token_type: "Bearer" });
    }

    if (url === META_MODEL_API_CONFIG.apiKeyMintUrl) {
      assert.equal(init?.headers?.["Authorization"], "Bearer meta-identity-token");
      assert.equal(init?.headers?.["x-api-version"], "1.0.0");
      return Response.json({ api_key: "meta-model-api-key" });
    }

    throw new Error(`Unexpected fetch: ${url}`);
  };

  const result = await pollForToken("muse-code", "device-123", "ignored-verifier", undefined);
  assert.equal(result.success, true);
  assert.equal(result.tokens.accessToken, "meta-model-api-key");
  assert.equal(result.tokens.refreshToken, "meta-identity-token");
  assert.equal(result.tokens.expiresIn, 86_400);
  assert.deepEqual(calls, [META_MODEL_API_CONFIG.tokenUrl, META_MODEL_API_CONFIG.apiKeyMintUrl]);
});

test("Meta OAuth key refresh re-mints from the identity token", async () => {
  globalThis.fetch = async (input, init) => {
    assert.equal(String(input), META_MODEL_API_CONFIG.apiKeyMintUrl);
    assert.equal(init?.headers?.["Authorization"], "Bearer meta-identity-token");
    return Response.json({ api_key: "meta-model-api-key-2" });
  };

  const refreshed = await refreshMetaModelApiToken("meta-identity-token", null, null);
  assert.equal(refreshed?.accessToken, "meta-model-api-key-2");
  assert.equal(refreshed?.refreshToken, "meta-identity-token");
  assert.equal(refreshed?.expiresIn, 86_400);
  assert.equal(supportsTokenRefresh("muse-code"), true);
});

test("Muse Code is exposed as one OAuth-primary dual-auth provider", () => {
  assert.ok(PROVIDERS["muse-code"]);
  assert.equal(PROVIDERS["muse-code"], museCodeOauth);
  assert.ok(OAUTH_PROVIDERS["muse-code"]);
  assert.equal(supportsDualAuthProvider("muse-code"), true);
  assert.equal(muse_codeProvider.authType, "oauth");
});

